app = "lucidly-app"
primary_region = "lhr"

[build]

[env]
  NODE_ENV = "production"
  DATABASE_URL = "file:/data/lucidly.db"
  PORT = "3000"
  # Public distribution must use expiring offline tokens (Shopify rejects
  # non-expiring tokens on the Admin API with a 403). Gated here so the custom
  # apps (fly.toml / fly.hm.toml) keep non-expiring tokens and avoid the
  # library's unlocked webhook-path refresh race. See shopify.server.ts.
  EXPIRING_OFFLINE_TOKENS = "true"
  # Web-pixel journey work PARKED 2026-08-01 — stop collecting on public too:
  # /api/journey acks pixel posts without writing. Reports were never enabled
  # here (JOURNEY_REPORTS_ENABLED deliberately absent). See journey_pixel_parked.md.
  JOURNEY_INGEST_ENABLED = "false"
  # Ops alerting: the Token Health Watchdog + refresh-failure hook email here when
  # an offline token faults (non-expiring 403 / revoked 401 / refresh race). Needs
  # RESEND_API_KEY set as a Fly secret to actually deliver; no-ops otherwise.
  OPS_ALERT_EMAIL = "see.lucidly@gmail.com"
  # Verified Resend sending domain (seelucidly.com). All app email (ops alerts +
  # merchant onboarding) sends from here; DKIM/SPF verified so it won't spam-file.
  LUCIDLY_FROM_EMAIL = "Lucidly <hello@seelucidly.com>"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  # 4x/8GB restored 2026-08 for the VB+HM data merge: this box now carries the
  # merged data of every shop. VB ALONE was kernel-OOM-killed 2x/day on 2x/4GB
  # (2026-05-05, Fly "OOM: node killed" emails) — same data now lives here, so
  # 4x/8GB is the floor, not an upgrade. NOTE: the V8 heap cap stays at
  # --max-old-space-size=3072 in package.json `start` (shared by all apps,
  # deliberate): the ~5GB non-heap margin is what absorbs SQLite mmap/page
  # cache, the Prisma engine process, sharp buffers and the 3 matcher worker
  # threads. Do NOT raise the heap cap unless logs show the V8 FATAL
  # "JavaScript heap out of memory" signature (kernel OOM = add RAM instead).
  # shared-cpu-2x hard-caps at 4GB on Fly, so 8GB forces the 4x size.
  size = "shared-cpu-4x"
  memory = "8192mb"

[mounts]
  source = "lucidly_app_data"
  destination = "/data"
