app = "lucidly"
primary_region = "lhr"

[build]

[env]
  NODE_ENV = "production"
  DATABASE_URL = "file:/data/lucidly.db"
  PORT = "3000"
  # Web-pixel journey work PARKED 2026-08-01 (revisit after real merchants are
  # onboarded — the single-clientId design caps stitching at ~15%; needs an own
  # first-party id + email stitch before it's worth building the reports). To
  # un-park: restore JOURNEY_REPORTS_ENABLED = "true" and remove the ingest kill
  # switch below. See memory journey_pixel_parked.md.
  # JOURNEY_REPORTS_ENABLED = "true"   # reports hidden while parked
  JOURNEY_INGEST_ENABLED = "false"     # stop collecting: /api/journey acks without writing
  # Ops alerting: the Token Health Watchdog + refresh-failure hook email here when
  # an offline token faults. Needs RESEND_API_KEY as a Fly secret to deliver.
  OPS_ALERT_EMAIL = "see.lucidly@gmail.com"
  # Verified Resend sending domain (seelucidly.com). All app email sends from here.
  LUCIDLY_FROM_EMAIL = "Lucidly <hello@seelucidly.com>"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-4x"
  memory = "8192mb"

[mounts]
  source = "lucidly_data"
  destination = "/data"
